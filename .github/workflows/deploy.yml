name: Deploy a GitHub Pages

# La página es estática. Los datos en vivo NO se capturan aquí: el CDN del
# portal no entrega el API a los runners de GitHub (IPs extranjeras). Los
# publica scripts/publicar_datos.sh (desde Colombia) en la rama `datos`, y la
# página los lee vía raw.githubusercontent.com.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build estático
        run: npm run build
        env:
          VITE_STATIC_DATA: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_LIVE_URL: https://raw.githubusercontent.com/${{ github.repository }}/datos/live.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
